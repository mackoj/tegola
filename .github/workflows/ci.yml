# Two jobs.
# linux-core runs on every push and PR: the pure packages (PLAN §2.4), the guard tests and the API lint. It's free,
# and it's the independent check on main that telaio's REVIEW asked for.
# macos runs only when started by hand: hosted macOS minutes cost money and hosted runners have no Xcode 27. It
# checks the iOS 26 SDK build with Xcode 26.6. Everything else runs on the Mac (scripts/test.sh, scripts/ci.sh).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux-core:
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Pure packages and guard tests
        run: scripts/test-linux.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API lint
        run: scripts/lint-api.sh
      - name: Secret scan
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && scripts/secret-scan.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-logs
          path: build/*.log
  # Xcode 26.6 on purpose: it checks the iOS 26 SDK build (the deployment floor), as telaio's manual job checks its
  # macOS 26 path. The Xcode 27.1 gate runs on the Mac (scripts/ci.sh).
  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && xcrun swift --version
      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          echo "DESTINATION=platform=iOS Simulator,id=$id" >> "$GITHUB_ENV"
      - name: Full suite
        run: scripts/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-logs
          path: build/*.log
