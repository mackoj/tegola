id: video-game
name:
  hobby: Video games
  singular: Game
  plural: Games
  collection: The Library
# Words that name the type in a photo's description or a typed line: the first piece's
# type is inferred from them, not asked (PD-166, D-62).
recognise: [video game, videogame, game cartridge, cartridge, console game]

mark: "CIB"
icon: cartridge
gradient: [indigo, claret]

# Supersedes the retro-game type. "Retro" was a moving date, not a category;
# the era is now a consequence of the media field. See 43_Video Games.dc.html.
supersedes:
  - type: official/retro-game@1
    # Old key -> new key. Anything absent here survives as a custom field,
    # so migrating can never lose a value.
    fields:
      cart: mediaCondition
      box: boxCondition
      manual: manualCondition
      # "cib" was a summary of the three axes above; the ladder derives it now,
      # so the field itself is dropped rather than carried over.
      cib: derived

# Every game runs these; a subtype adds its own (D-37). codeExpiry reads
# codeExpires and is silent without it; unfinished is off unless the
# collector turns it on (D-20).
clocks: [codeExpiry, unfinished]

# Same title, different region or print = different object.
duplicates: rows

spine:
  title: Title
  subtitle: Platform           # not the publisher — this is how shelves are read
  year: Released               # this print, not the game's first release
  acquired: Acquired on
  paid: Paid
  value: Value

# One scale, shared by every axis and every medium. Missing is a step, so
# completeness and condition are the same question asked once.
conditions:
  - Sealed
  - Mint
  - Near mint
  - Very good
  - Good
  - Fair
  - Poor
allowMissing: true

# Signature renderers — see One Roof, section 09. Two is the cap, and the
# clock is not one of them: it renders in the status slot like every clock.
signatures:
  - renderer: ladder
    axes: [mediaCondition, boxCondition, manualCondition]
  - renderer: set
    binds: inserts             # slots come from the subtype's parts

lookup:
  symbologies: [ean13, upc-a, jan]
  providers: [openvgdb]
  localCorpus: releases.json   # ~180k releases, region-resolved
  ocrFields: [title, platform, catalogueNumber]
  identifierPattern: per-platform

searchable: [title, subtitle, year, publisher, region, edition, place]

placeLabel: Where it is

related: [subtitle, publisher, series]

fields:
  - key: platform
    label: Platform
    type: text
    sample: Super Famicom
    auto: true
  - key: publisher
    label: Publisher
    type: text
    sample: Square
    auto: true
  - key: catalogueNumber
    label: Catalogue no.
    type: text
    note: the real identifier for pre-barcode media
    sample: SHVC-AC6J-JPN
    auto: true
  - key: region
    label: Region
    type: choice
    options: [NTSC-U, NTSC-J, PAL, Region-free]
    required: true
    sample: NTSC-J
  - key: media
    label: Media
    type: choice
    options: [Cartridge, Optical disc, Floppy, Card, Download code]
    note: a subtype presets it and hides the picker
    required: true
    sample: Cartridge
  - key: edition
    label: Edition
    type: text
    note: first print, Greatest Hits, Platinum, budget reissue — never auto-filled
    sample: First print
  - key: revision
    label: Revision
    type: text
    note: cart board rev / disc version; hidden on platforms without them
    sample: Rev A
  - key: mediaCondition
    label: Cart / disc
    type: scale
    ladderAxis: 1
    sample: Near mint
  - key: boxCondition
    label: Box
    type: scale
    ladderAxis: 2
    sample: Very good
  - key: manualCondition
    label: Manual
    type: scale
    ladderAxis: 3
    sample: Good
  - key: inserts
    label: What's inside
    type: set
    options: [manual, insert]
    slotsFrom: subtype           # these two until the platform has a subtype
    sample: 4 of 6
  - key: slab
    label: Sealed / graded
    type: choice
    options: [None, Sealed ungraded, WATA, VGA]
    sample: None
  - key: saveBattery
    label: Save battery
    type: date
    note: feeds the clock; original unless replaced
    sample: Original · 1995
  - key: codeExpires
    label: Code expires
    type: date
    note: a download code or code card's last day; feeds the codeExpiry clock
    sample: 30 Jun 2027
  - key: playStatus
    label: Play status
    type: choice
    options: [Not started, Playing, Finished, Abandoned]
    note: replaces playLog's finished flag (D-20)
    sample: Finished
  - key: playLog
    label: Played
    type: log
    entry: [date, note]
    sample: 3 entries

# One level below the type, keyed on platform (48). The platform field is the
# subtype: each one fills it in and hides it. A platform without a subtype
# works with the parent's fields alone. These five replace 43's mediaRules
# (D-18); the other platforms get theirs as collectors validate them.
subtypes:
  - key: saturn
    label: Sega Saturn
    recognise: [sega saturn, saturn]
    presets:
      platform: Sega Saturn
      media: Optical disc
      region: [NTSC-J, NTSC-U, PAL]
      parts: [case, manual, disc, spine card]
      lookup: catalogueNumber    # the product code on the spine, T-xxxxG
      clock: discRot-pending     # no disc-rot clock in v1 (PD-018); held until there's evidence
    adds:
      - { key: spineCard, label: Spine card, type: yesNo, note: "Japanese releases ship with one; without it a CIB game is incomplete" }
      - { key: ramCart, label: Needs RAM cart, type: choice, options: [No, 1MB, 4MB] }
      - { key: satakore, label: Satakore ID, type: text }
  - key: n64
    label: Nintendo 64
    recognise: [n64, nintendo 64]
    presets:
      platform: Nintendo 64
      media: Cartridge
      parts: [box, manual, cart, dust cover, insert]
      lookup: catalogueNumber
      clock: saveBattery
    adds:
      - { key: expansionPak, label: Expansion Pak, type: choice, options: [No, Enhanced, Required] }
      - { key: pakSupport, label: Rumble / Controller Pak, type: set, options: [Rumble Pak, Controller Pak] }
  - key: neo-geo
    label: Neo Geo
    recognise: [neo geo, neogeo, aes, mvs]
    presets:
      platform: Neo Geo
      media: Cartridge
      parts: [box, manual, cart, marquee]
      lookup: catalogueNumber
      clock: none                # the save battery is on MVS motherboards, not carts
    adds:
      - { key: board, label: Board, type: choice, options: [AES, MVS], required: true }
      - { key: conversion, label: Conversion, type: yesNo, note: an MVS board rehoused as AES; never passes for an original }
  - key: game-boy
    label: Game Boy
    recognise: [game boy, gameboy, game boy color, gbc]
    presets:
      platform: Game Boy
      media: Cartridge
      parts: [box, manual, cart, inner tray]
      lookup: catalogueNumber
      clock: saveBattery
    adds:
      - { key: sgb, label: Super Game Boy, type: yesNo }
  - key: ps1
    label: PlayStation
    recognise: [playstation, ps1, psx]
    presets:
      platform: PlayStation
      media: Optical disc
      parts: [case, manual, disc, spine card]
      lookup: [catalogueNumber, barcode]   # SCES / SLUS / SLPS serial first
      clock: discRot-pending     # no disc-rot clock in v1 (PD-018); held until there's evidence
    adds:
      - { key: printLabel, label: Label, type: choice, options: [Black label, Platinum, Greatest Hits, The Best] }
